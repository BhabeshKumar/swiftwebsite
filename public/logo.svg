<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>

  <!-- Main AI symbol - Neural network style -->
  <g fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top nodes -->
    <circle cx="70" cy="50" r="6" fill="#06b6d4"/>
    <circle cx="100" cy="40" r="6" fill="#06b6d4"/>
    <circle cx="130" cy="50" r="6" fill="#06b6d4"/>

    <!-- Middle node -->
    <circle cx="100" cy="100" r="8" fill="#22d3ee"/>

    <!-- Bottom nodes -->
    <circle cx="70" cy="150" r="6" fill="#06b6d4"/>
    <circle cx="100" cy="160" r="6" fill="#06b6d4"/>
    <circle cx="130" cy="150" r="6" fill="#06b6d4"/>

    <!-- Connecting lines -->
    <line x1="70" y1="50" x2="100" y2="100" stroke="#06b6d4" stroke-width="2"/>
    <line x1="100" y1="40" x2="100" y2="100" stroke="#06b6d4" stroke-width="2"/>
    <line x1="130" y1="50" x2="100" y2="100" stroke="#06b6d4" stroke-width="2"/>

    <line x1="100" y1="100" x2="70" y2="150" stroke="#06b6d4" stroke-width="2"/>
    <line x1="100" y1="100" x2="100" y2="160" stroke="#06b6d4" stroke-width="2"/>
    <line x1="100" y1="100" x2="130" y2="150" stroke="#06b6d4" stroke-width="2"/>
  </g>

  <!-- Accent glow effect -->
  <circle cx="100" cy="100" r="8" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.5"/>
</svg>
